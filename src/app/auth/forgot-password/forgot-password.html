<div class="forgot-password-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Recuperar Senha</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>Informe seu email para receber um link de redefinição de senha.</p>
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" placeholder="seu@email.com">
          <mat-error *ngIf="forgotPasswordForm.get('email')?.hasError('required')">
            Email é obrigatório
          </mat-error>
          <mat-error *ngIf="forgotPasswordForm.get('email')?.hasError('email')">
            Email inválido
          </mat-error>
        </mat-form-field>
        <button mat-raised-button color="primary" type="submit" [disabled]="forgotPasswordForm.invalid">
          Enviar
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
