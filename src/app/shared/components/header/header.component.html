<mat-toolbar color="primary" class="header-toolbar">
  <a routerLink="/" class="logo">
    <span>Sistema de Agendamento</span>
  </a>
  <span class="spacer"></span>
  <div class="desktop-menu">
    <a mat-button routerLink="/login">
      <mat-icon>login</mat-icon> Entrar
    </a>
    <a mat-button routerLink="/register">
      <mat-icon>person_add</mat-icon> Registrar
    </a>
    <a mat-button routerLink="/client/profile">
      <mat-icon>person</mat-icon> Perfil
    </a>
    <a mat-button routerLink="/client/schedule">
      <mat-icon>schedule</mat-icon> Agendar
    </a>
  </div>
  <button mat-icon-button [matMenuTriggerFor]="menu" class="mobile-menu">
    <mat-icon>menu</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <a mat-menu-item routerLink="/login">
      <mat-icon>login</mat-icon> Entrar
    </a>
    <a mat-menu-item routerLink="/register">
      <mat-icon>person_add</mat-icon> Registrar
    </a>
    <a mat-menu-item routerLink="/client/profile">
      <mat-icon>person</mat-icon> Perfil
    </a>
    <a mat-menu-item routerLink="/client/schedule">
      <mat-icon>schedule</mat-icon> Agendar
    </a>
  </mat-menu>
</mat-toolbar>
