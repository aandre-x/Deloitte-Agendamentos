<div class="services-container">
  <h2>Gerenciar Serviços</h2>
  <form [formGroup]="serviceForm" (ngSubmit)="submitService()">
    <mat-form-field appearance="fill">
      <mat-label>Nome do Serviço</mat-label>
      <input matInput formControlName="name">
      <mat-error *ngIf="serviceForm.get('name')?.hasError('required')">Nome é obrigatório</mat-error>
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Descrição</mat-label>
      <textarea matInput formControlName="description"></textarea>
      <mat-error *ngIf="serviceForm.get('description')?.hasError('required')">Descrição é obrigatória</mat-error>
    </mat-form-field>
    <button mat-button type="submit" [disabled]="serviceForm.invalid">
      {{ editingId ? 'Atualizar' : 'Adicionar' }}
    </button>
    <button mat-button type="button" (click)="resetForm()" *ngIf="editingId">Cancelar</button>
  </form>
  <mat-card *ngFor="let service of services">
    <mat-card-title>{{ service.name }}</mat-card-title>
    <mat-card-content>{{ service.description }}</mat-card-content>
    <mat-card-actions>
      <button mat-button (click)="editService(service)">Editar</button>
      <button mat-button color="warn" (click)="deleteService(service.id)">Excluir</button>
    </mat-card-actions>
  </mat-card>
</div>
