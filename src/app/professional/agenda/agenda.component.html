<div class="agenda-container">
  <h2>Agenda</h2>
  <form [formGroup]="filterForm" (ngSubmit)="loadAgenda()">
    <mat-form-field appearance="fill">
      <mat-label>Data Inicial</mat-label>
      <input matInput type="date" formControlName="startDate">
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Data Final</mat-label>
      <input matInput type="date" formControlName="endDate">
    </mat-form-field>
    <button mat-button type="submit">Filtrar</button>
  </form>
  <mat-table [dataSource]="appointments">
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef>ID</mat-header-cell>
      <mat-cell *matCellDef="let appointment">{{ appointment.id }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="date">
      <mat-header-cell *matHeaderCellDef>Data</mat-header-cell>
      <mat-cell *matCellDef="let appointment">{{ appointment.date }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="time">
      <mat-header-cell *matHeaderCellDef>Horário</mat-header-cell>
      <mat-cell *matCellDef="let appointment">{{ appointment.time }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="service">
      <mat-header-cell *matHeaderCellDef>Serviço</mat-header-cell>
      <mat-cell *matCellDef="let appointment">{{ appointment.service }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="client">
      <mat-header-cell *matHeaderCellDef>Cliente</mat-header-cell>
      <mat-cell *matCellDef="let appointment">{{ appointment.client }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef>Status</mat-header-cell>
      <mat-cell *matCellDef="let appointment">{{ appointment.status }}</mat-cell>
    </ng-container>
    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>
</div>
