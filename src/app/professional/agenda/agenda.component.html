<div class="agenda-container">
  <h2>Minha Agenda</h2>
  <form [formGroup]="filterForm">
    <mat-form-field appearance="fill">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option value="">Todos</mat-option>
        <mat-option value="Pendente">Pendente</mat-option>
        <mat-option value="Concluído">Concluído</mat-option>
        <mat-option value="Cancelado">Cancelado</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
  <mat-table [dataSource]="appointments">
    <ng-container matColumnDef="date">
      <mat-header-cell *matHeaderCellDef>Data</mat-header-cell>
      <mat-cell *matCellDef="let appointment">{{ appointment.date }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="time">
      <mat-header-cell *matHeaderCellDef>Horário</mat-header-cell>
      <mat-cell *matCellDef="let appointment">{{ appointment.time }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="service">
      <mat-header-cell *matHeaderCellDef>Serviço</mat-header-cell>
      <mat-cell *matCellDef="let appointment">{{ appointment.service }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="client">
      <mat-header-cell *matHeaderCellDef>Cliente</mat-header-cell>
      <mat-cell *matCellDef="let appointment">{{ appointment.client }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef>Status</mat-header-cell>
      <mat-cell *matCellDef="let appointment">{{ appointment.status }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>Ações</mat-header-cell>
      <mat-cell *matCellDef="let appointment">
        <button mat-button (click)="updateStatus(appointment.id, 'Concluído')">Concluído</button>
        <button mat-button (click)="updateStatus(appointment.id, 'Cancelado')">Cancelar</button>
      </mat-cell>
    </ng-container>
    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>
</div>
