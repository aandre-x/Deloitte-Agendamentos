<div class="container">
  <h1>Explore Nossos Serviços</h1>
  <div class="services-grid">
    <mat-card class="service-card" *ngFor="let service of services$ | async">
      <mat-card-header>
        <mat-card-title>{{ service.name }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{ service.description || 'Descrição do serviço em breve.' }}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary" [routerLink]="['/client/schedule']">Agendar</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
