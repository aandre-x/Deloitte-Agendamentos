<div class="profile-container">
  <h2>Perfil do Usuário</h2>
  <mat-card>
    <mat-card-title>Informações</mat-card-title>
    <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
      <mat-form-field appearance="fill">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="name">
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email">
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Telefone</mat-label>
        <input matInput formControlName="phone">
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Data de Nascimento</mat-label>
        <input matInput formControlName="birthDate">
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Endereço</mat-label>
        <input matInput formControlName="address">
      </mat-form-field>
      <button mat-button type="submit">Salvar</button>
    </form>
  </mat-card>
  <mat-card *ngIf="profile">
    <mat-card-title>Visualização</mat-card-title>
    <mat-list>
      <mat-list-item>Nome: {{ profile.name }}</mat-list-item>
      <mat-list-item>Email: {{ profile.email }}</mat-list-item>
      <mat-list-item *ngIf="profile.phone">Telefone: {{ profile.phone }}</mat-list-item>
      <mat-list-item *ngIf="profile.birthDate">Data de Nascimento: {{ profile.birthDate }}</mat-list-item>
      <mat-list-item *ngIf="profile.address">Endereço: {{ profile.address }}</mat-list-item>
    </mat-list>
  </mat-card>
</div>
