<div class="container">
  <h1>Histórico de Agendamentos</h1>
  <div class="appointments-grid">
    <mat-card class="appointment-card" *ngFor="let appointment of appointments">
      <mat-card-header>
        <mat-card-title>{{ appointment.service }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p><strong>Profissional:</strong> {{ appointment.professional }}</p>
        <p><strong>Data:</strong> {{ appointment.date }}</p>
        <p><strong>Horário:</strong> {{ appointment.slot }}</p>
        <p><strong>Status:</strong> {{ appointment.status }}</p>
      </mat-card-content>
      <mat-card-actions *ngIf="appointment.status === 'Agendado'">
        <button mat-button color="warn" (click)="cancelAppointment(appointment.id)">Cancelar</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
