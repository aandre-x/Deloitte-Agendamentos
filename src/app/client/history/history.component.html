<div class="history-container">
  <h2>Histórico de Consultas</h2>
  <mat-table [dataSource]="appointments">
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef>ID</mat-header-cell>
      <mat-cell *matCellDef="let appointment">{{ appointment.id }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="service">
      <mat-header-cell *matHeaderCellDef>Serviço</mat-header-cell>
      <mat-cell *matCellDef="let appointment">{{ appointment.service }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="professional">
      <mat-header-cell *matHeaderCellDef>Profissional</mat-header-cell>
      <mat-cell *matCellDef="let appointment">{{ appointment.professional }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="date">
      <mat-header-cell *matHeaderCellDef>Data</mat-header-cell>
      <mat-cell *matCellDef="let appointment">{{ appointment.date }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="slot">
      <mat-header-cell *matHeaderCellDef>Horário</mat-header-cell>
      <mat-cell *matCellDef="let appointment">{{ appointment.slot }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef>Status</mat-header-cell>
      <mat-cell *matCellDef="let appointment">{{ appointment.status }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>Ações</mat-header-cell>
      <mat-cell *matCellDef="let appointment">
        <button mat-button color="warn" (click)="cancelAppointment(appointment.id)" [disabled]="appointment.status === 'Cancelado'">
          Cancelar
        </button>
      </mat-cell>
    </ng-container>
    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>
</div>
