<div class="history-container">
  <h2>Histórico de Agendamentos</h2>
  <mat-card *ngFor="let appointment of appointments">
    <mat-card-title>{{ appointment.service }}</mat-card-title>
    <mat-list>
      <mat-list-item>Profissional: {{ appointment.professional }}</mat-list-item>
      <mat-list-item>Data: {{ appointment.date }}</mat-list-item>
      <mat-list-item>Horário: {{ appointment.slot }}</mat-list-item>
      <mat-list-item>Status: {{ appointment.status }}</mat-list-item>
    </mat-list>
  </mat-card>
</div>
