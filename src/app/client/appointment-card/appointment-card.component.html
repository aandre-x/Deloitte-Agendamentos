<mat-card class="appointment-card" *ngIf="slot">
  <mat-card-title>{{ slot.professional }}</mat-card-title>
  <mat-card-content>
    <p>Data: {{ slot.date }}</p>
    <p>Horário: {{ slot.time }}</p>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button (click)="bookSlot()">Agendar</button>
  </mat-card-actions>
</mat-card>
